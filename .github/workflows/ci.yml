name: Ledger checks

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Lint backend
        run: ruff check backend/
      - name: Test backend
        # Coverage floor (measured at 69%); raise it as tests are added.
        run: pytest backend/tests/ -v --cov=backend/app --cov-report=term --cov-fail-under=65
      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit -r backend/requirements.txt

  backend-postgres:
    # Production runs PostgreSQL; SQLite ignores VARCHAR lengths and other constraints,
    # so run the same suite against a real PostgreSQL service as well.
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ledger
          POSTGRES_PASSWORD: ledger
          POSTGRES_DB: ledger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ledger"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://ledger:ledger@localhost:5432/ledger_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend development dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Test backend on PostgreSQL
        run: pytest backend/tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Audit production frontend dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  image-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t ledger-api:security -f backend/Dockerfile backend
      # Keep unfixed base-image findings visible while blocking on fixes we can apply.
      - name: Report all image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ledger-api:security
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
      - name: Fail on fixable image vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ledger-api:security
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          ignore-unfixed: 'true'

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          # Authenticates the action's account lookup; without it the shared runner IP hits
          # GitHub's anonymous rate limit and the action falls back to requiring a license.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  licenses:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          deny-licenses: AGPL-3.0, GPL-3.0
